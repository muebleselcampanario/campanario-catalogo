<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El Campanario · Catálogo</title></head><body><p style="font-family:Arial,sans-serif;text-align:center;margin:3rem">Cargando catálogo…</p><script>const parts=location.pathname.split("/").filter(Boolean);const known=["producto","ambiente","ambientes","catalogo","linea","ofertas","blog","carrito","buscar","categoria"];const i=parts.findIndex(x=>known.includes(x));const base=i>=0?"/"+parts.slice(0,i).join("/"):"/";sessionStorage.setItem("campanario_deep_path",location.pathname+location.search+location.hash);location.replace(base||"/");</script></body></html>
